[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[project]
name = "liteseries"
version = "1.1.0"
description = "SQLite-backed local caching helpers for time series data."
authors = [{ name = "Charles Marks", email = "charlesmarksco@gmail.com" }]
readme = "README.md" 
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "adbc-driver-sqlite",
  "pyarrow",
  "python-dateutil",
]

[tool.uv.build-backend]
module-name = "liteseries"
module-root = ""

[tool.coverage.run]
branch = true
core = "ctrace"

[tool.coverage.report]
exclude_also = [
  "if __debug__",
  'if self\.debug',
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  '@(abc\.)?abstractmethod',
]
ignore_errors = true

[tool.coverage.html]
directory = "tests/report/coverage"
show_contexts = true

[tool.pytest.ini_options]
markers = [
  "live: Tests that require live Barchart auth.",
  "regression: Tests that failed in old versions.",
]
xfail_strict = true

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
  "I",
  "E4",
  "E5",
  "E7",
  "E9",
  "F",
  "B",
  "Q",
  "FA",
  "UP",
  "PERF",
  "FURB",
  "C4",
  "SIM",
  "PIE",
  "RET",
  "RUF",
  "ASYNC",
  "PLE",
  "PLW",
  "PLR",
]
ignore = ["E701", "E731", "Q000", "Q001", "PLR09"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
required-imports = ["from __future__ import annotations"]
# float-to-top = true

[tool.ruff.lint.per-file-ignores]
"liteseries/_handlers.py" = ["PLR1702", "PLW0603"]
"liteseries/_util.py" = ["PLW0603"]
"tests/integration/test_public_api.py" = ["E501", "PLR2004", "SIM105", "SIM223"]

[tool.ruff.analyze]
detect-string-imports = true

# Conda env seems broken for pyrefly right now.
# python-interpreter-path = "your/path"
# conda-environment = "your_conda_env"
[tool.pyrefly.errors]
untyped-import = false
